services:

  # ── ChromaDB ──────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: hypertech-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  # ── Langfuse database (Postgres) ──────────────────────────
  langfuse-db:
    image: postgres:15-alpine
    container_name: hypertech-langfuse-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_postgres:/var/lib/postgresql/data

  # ── ClickHouse (trace storage for Langfuse v3) ────────────
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.6-alpine
    container_name: hypertech-langfuse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse_clickhouse:/var/lib/clickhouse
      - ./docker/clickhouse/listen.xml:/etc/clickhouse-server/config.d/listen.xml:ro
      - ./docker/clickhouse/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ── MinIO (S3-compatible event storage for Langfuse v3) ───
  langfuse-minio:
    image: minio/minio:latest
    container_name: hypertech-langfuse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - langfuse_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Creates the langfuse-events bucket on first boot ──────
  langfuse-minio-init:
    image: minio/mc:latest
    container_name: hypertech-langfuse-minio-init
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://langfuse-minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/langfuse-events &&
      echo 'Bucket ready.'
      "
    restart: "no"

  # ── Langfuse server v3 ────────────────────────────────────
  langfuse-server:
    image: langfuse/langfuse:3
    container_name: hypertech-langfuse
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_ACCESS_KEY_ID: minioadmin
      LANGFUSE_S3_SECRET_ACCESS_KEY: minioadmin
      LANGFUSE_S3_FORCE_PATH_STYLE: "true"
      NEXTAUTH_SECRET: hypertech-local-secret
      SALT: hypertech-local-salt
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    restart: unless-stopped

volumes:
  chroma_data:
  langfuse_postgres:
  langfuse_clickhouse:
  langfuse_minio:

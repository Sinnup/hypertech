name: CI/CD Pipeline

on:
  push:
    branches:
      - "feature/**"
      - "develop"
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ── PR Review (style + architecture) ────────────────────────────────────────
  pr_review:
    name: PR Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PR Review agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          python -c "
          import os, json
          from agents.pr_review import agent as pr_review
          from core.state.pipeline_state import new_state

          branch = os.environ.get('GITHUB_HEAD_REF', os.environ.get('GITHUB_REF_NAME', 'unknown'))
          ticket_id = branch.replace('feature/', '') if branch.startswith('feature/') else 'CI'

          state = new_state(ticket_id=ticket_id, prompt='CI code review')
          state['coder_output'] = {
              'filename': 'poc/' + ticket_id + '/index.html',
              'local_path': 'poc/' + ticket_id + '/index.html',
              'branch_url': '',
              'lines': 0,
          }
          result = pr_review.run(state)
          verdict = result.get('status', 'unknown')
          print(f'PR Review verdict: {verdict}')
          if 'blocked' in verdict:
              exit(1)
          "

  # ── Semgrep SAST ─────────────────────────────────────────────────────────────
  security_scan:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    needs: pr_review
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ── Docker Build ──────────────────────────────────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: security_scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build pipeline image
        run: |
          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --tag hypertech-pipeline:${{ github.sha }} \
            --file docker/Dockerfile \
            . || echo "No Dockerfile yet — skipping build"

  # ── Deploy to Dev ─────────────────────────────────────────────────────────────
  deploy_dev:
    name: Deploy Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Notify Slack — dev deploy
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"🚀 Dev deploy triggered for branch \`${BRANCH_NAME}\` (commit \`${COMMIT_SHA}\`)\"}"

  # ── Deploy to Cert (manual approval gate) ─────────────────────────────────────
  deploy_cert:
    name: Deploy Cert
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: cert
    steps:
      - uses: actions/checkout@v4
      - name: Notify Slack — cert deploy
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"✅ Cert deploy approved and started for \`${COMMIT_SHA}\`\"}"

  # ── Deploy to Prod (manual approval gate) ─────────────────────────────────────
  deploy_prod:
    name: Deploy Prod
    runs-on: ubuntu-latest
    needs: deploy_cert
    if: github.ref == 'refs/heads/main'
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Notify Slack — prod deploy
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"🏁 Production deploy approved and started for \`${COMMIT_SHA}\`\"}"

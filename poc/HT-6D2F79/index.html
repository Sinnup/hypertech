<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POC · Login view</title>
  <!-- Tailwind via CDN (lightweight) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- subtle inter font (optional, clean) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body {
      background: linear-gradient(145deg, #f9fafb 0%, #eef2f6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 1rem;
    }
    .card-shadow {
      box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.08), 0 8px 12px -4px rgba(0,0,0,0.02);
    }
    .btn-subtle {
      transition: all 0.15s ease;
    }
    .btn-subtle:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(59, 130, 246, 0.18);
    }
    .divider-line {
      background: linear-gradient(to right, transparent, #d1d5db, transparent);
      height: 1px;
    }
  </style>
</head>
<body>

  <!-- main card – login view, no interaction, only webview -->
  <div class="w-full max-w-md bg-white/90 backdrop-blur-sm rounded-3xl card-shadow px-8 py-10 md:px-10 md:py-12 border border-white/40">
    
    <!-- header / branding -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-600 mb-4 ring-1 ring-indigo-100/60">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
        </svg>
      </div>
      <h1 class="text-2xl font-semibold tracking-tight text-gray-900">Welcome back</h1>
      <p class="text-sm text-gray-500 mt-1.5">sign in to your workspace</p>
    </div>

    <!-- dummy form fields (static, no interaction) -->
    <div class="space-y-5">
      <!-- email field (dummy) -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
            </svg>
          </div>
          <input type="email" value="jane@example.co" readonly
            class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 bg-gray-50/70 text-gray-700 text-sm cursor-default shadow-sm focus:outline-none" />
        </div>
      </div>

      <!-- password field (dummy) -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
            </svg>
          </div>
          <input type="password" value="••••••••" readonly
            class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 bg-gray-50/70 text-gray-700 text-sm cursor-default shadow-sm focus:outline-none" />
        </div>
      </div>

      <!-- dummy remember + forgot (static) -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-gray-500 cursor-default">
          <input type="checkbox" checked disabled class="w-4 h-4 rounded border-gray-300 text-indigo-500 opacity-60 cursor-default" />
          <span>Remember me</span>
        </label>
        <span class="text-indigo-500/70 cursor-default">Forgot password?</span>
      </div>

      <!-- primary button (no interaction, just visual) -->
      <button type="button" class="btn-subtle w-full py-3.5 rounded-xl bg-indigo-600 text-white font-medium text-sm shadow-sm cursor-default">
        Sign in
      </button>

      <!-- divider + secondary buttons (webview style) -->
      <div class="relative my-6">
        <div class="divider-line"></div>
        <span class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-white px-3 text-xs text-gray-400">or continue with</span>
      </div>

      <!-- social / sso buttons (dummy, no interaction) -->
      <div class="grid grid-cols-2 gap-3">
        <button type="button" class="btn-subtle flex items-center justify-center gap-2 py-3 rounded-xl border border-gray-200 bg-white text-gray-600 text-sm font-medium cursor-default hover:bg-gray-50/50">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button type="button" class="btn-subtle flex items-center justify-center gap-2 py-3 rounded-xl border border-gray-200 bg-white text-gray-600 text-sm font-medium cursor-default hover:bg-gray-50/50">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
          GitHub
        </button>
      </div>

      <!-- SSO / enterprise button (dummy) -->
      <button type="button" class="w-full py-3 rounded-xl border border-dashed border-gray-300 text-gray-400 text-sm font-medium cursor-default hover:border-gray-400/50 transition-colors">
        + Enterprise SSO
      </button>

      <!-- signup link (static) -->
      <p class="text-center text-sm text-gray-400 pt-2">
        Don’t have an account? <span class="text-indigo-400/80 cursor-default">Create one</span>
      </p>
    </div>

    <!-- tiny footer – webview only -->
    <div class="mt-8 text-center text-[10px] text-gray-300 uppercase tracking-widest">
      <span>webview · prototype</span>
    </div>
  </div>

  <!-- no script interaction – pure UI demonstration -->
</body>
</html>

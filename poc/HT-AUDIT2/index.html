<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Hypertech · POC</title>
    <!-- Tailwind CSS via CDN (lightweight, minimal) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Optional: fine-tune default style (no extra config needed) -->
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 to-slate-100 antialiased">

    <!-- Minimal card container -->
    <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-lg px-10 py-12 text-center border border-slate-200/60 max-w-sm w-full mx-4">
        <h1 class="text-2xl font-semibold text-slate-800 tracking-tight mb-2">
            👋 Hypertech
        </h1>
        <p class="text-slate-500 text-sm mb-8">
            Click the button to say hello
        </p>

        <!-- Single button – triggers alert -->
        <button 
            id="helloBtn"
            class="inline-block px-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium text-base rounded-xl shadow-md hover:shadow-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 cursor-pointer"
        >
            Say Hello
        </button>

        <!-- (optional) tiny hint, still minimal -->
        <p class="mt-6 text-xs text-slate-400/70">prototype · one click</p>
    </div>

    <!-- Vanilla JS – clean and direct -->
    <script>
        (function() {
            'use strict';
            const button = document.getElementById('helloBtn');
            if (button) {
                button.addEventListener('click', function() {
                    alert('Hello Hypertech');
                });
            }
        })();
    </script>

</body>
</html>

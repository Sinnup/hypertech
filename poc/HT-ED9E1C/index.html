<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POC · Login view (static)</title>
  <!-- Tailwind CSS via CDN (lightweight, no extra deps) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- subtle inter font for modern look (optional, but clean) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { background: #f8fafc; }
    /* subtle card shadow & border */
    .login-card {
      box-shadow: 0 8px 24px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.02);
      transition: box-shadow 0.1s ease;
    }
    /* dummy placeholder – no interaction, just visual */
    .btn-outline {
      border: 1px solid #d1d5db;
      background: white;
    }
    .btn-outline:hover {
      background: #f9fafb;
      border-color: #9ca3af;
    }
    .btn-primary {
      background: #2563eb;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    /* divider lines */
    .divider {
      display: flex;
      align-items: center;
      color: #9ca3af;
      font-size: 0.8rem;
      gap: 0.75rem;
    }
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }
    /* dummy icon placeholders (pure css circles) */
    .social-icon {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 9999px;
      background: #f1f5f9;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 500;
      color: #334155;
      border: 1px solid #e2e8f0;
      transition: background 0.1s;
    }
    .social-icon:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-8">

  <!-- main card – login webview (static, no interaction) -->
  <div class="login-card w-full max-w-sm bg-white rounded-2xl p-8 border border-gray-100/80">
    
    <!-- branding / header -->
    <div class="text-center mb-6">
      <div class="mx-auto mb-3 h-12 w-12 rounded-full bg-blue-50 flex items-center justify-center">
        <svg class="w-7 h-7 text-blue-600" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
        </svg>
      </div>
      <h1 class="text-2xl font-semibold text-gray-900 tracking-tight">Welcome back</h1>
      <p class="text-sm text-gray-500 mt-1">Sign in to your account</p>
    </div>

    <!-- email field (dummy, no validation) -->
    <div class="mb-4">
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
      <input 
        type="email" 
        id="email" 
        value="demo@example.com"
        readonly
        class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-800 placeholder-gray-400 focus:outline-none cursor-default"
      />
    </div>

    <!-- password field (dummy, no interaction) -->
    <div class="mb-5">
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
      <input 
        type="password" 
        id="password" 
        value="••••••••"
        readonly
        class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-800 placeholder-gray-400 focus:outline-none cursor-default"
      />
    </div>

    <!-- primary action button (static, no interaction) -->
    <button 
      class="btn-primary w-full text-white font-medium py-2.5 rounded-xl text-sm transition duration-150 cursor-default"
    >
      Sign in
    </button>

    <!-- divider + social buttons (purely visual) -->
    <div class="divider my-6">
      <span>or continue with</span>
    </div>

    <!-- social login row (dummy buttons, no interaction) -->
    <div class="flex justify-center gap-4 mb-6">
      <span class="social-icon cursor-default" title="Google (dummy)">G</span>
      <span class="social-icon cursor-default" title="GitHub (dummy)">GH</span>
      <span class="social-icon cursor-default" title="Apple (dummy)"></span>
    </div>

    <!-- secondary link row (static) -->
    <div class="text-center text-sm text-gray-500 space-y-2">
      <p>
        <span class="text-gray-400">Don’t have an account?</span>
        <a href="#" class="text-blue-600 font-medium hover:underline pointer-events-none">Sign up</a>
      </p>
      <p>
        <a href="#" class="text-blue-600 font-medium hover:underline pointer-events-none">Forgot password?</a>
      </p>
    </div>

    <!-- tiny footer: webview indicator (purely informational) -->
    <div class="mt-8 pt-4 border-t border-gray-100 text-center">
      <span class="text-[0.7rem] uppercase tracking-wider text-gray-400 bg-gray-50 px-3 py-1 rounded-full">webview · static prototype</span>
    </div>
  </div>

  <!-- no script interaction – pure static layout -->
</body>
</html>
